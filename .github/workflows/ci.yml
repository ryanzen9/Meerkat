name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  check-and-package:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, check formatting, typecheck and test
        run: bun run check

      - name: Build and package extension
        run: bun run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: meerkat-vsix-${{ github.sha }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
